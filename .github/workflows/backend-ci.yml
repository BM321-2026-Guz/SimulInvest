name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Sadece bu çalıştırmaya özel rastgele test anahtarı; repoda hiçbir yerde sabit değer yok.
      - name: Test için JWT_SECRET üret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: Kod stili (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testler ve kapsam
        env:
          PRICE_SOURCE: mock
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=50
